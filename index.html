<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; form-action 'none'; base-uri 'none'">
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="css/style.css">
    <title>MP3 Player</title>
</head>
<body data-pagina="index">
    <div class="wrap">
        <header>
            <h1>MP3 Player</h1>
            <p class="sub">Player audio online</p>
            <nav class="nav">
                <a class="btn" href="index.html">Colecția</a>
                <a class="btn" href="lista.html">Pe genuri</a>
                <a class="btn" href="playlisturi.html">Playlisturi</a>
            </nav>
            <div class="bar"></div>
        </header>

        <section class="card">
            <h2>Adaugă o melodie</h2>
            <p class="sub">Fișierul rămâne doar în browserul tău (nu se trimite pe niciun server).</p>
            <form id="formUpload" autocomplete="off">
                <label for="nume_melodie">Numele melodiei</label>
                <input type="text" id="nume_melodie" name="nume_melodie" maxlength="100" required placeholder="Exemplu: Can You Feel My Heart">

                <label for="gen">Genul muzical</label>
                <select id="gen" name="gen" required></select>

                <label for="fisier">Fișier MP3 (max. 10 MB)</label>
                <input type="file" id="fisier" name="fisier" accept=".mp3,audio/mpeg" required>

                <p class="sus"><button class="btn" type="submit">Încarcă melodia</button></p>
                <p class="mesaj" id="mesaj" role="status"></p>
            </form>
        </section>

        <section class="card">
            <h2>Colecția mea</h2>
            <div id="colectie"></div>
        </section>

        <footer>MP3 Player · Player audio online</footer>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
